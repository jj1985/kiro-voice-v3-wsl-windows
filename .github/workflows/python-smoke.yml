name: Python smoke checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m py_compile wsl/backends.py wsl/kiro_voice.py wsl/test_backends.py windows/audio_bridge.py
      - name: Run backend unit tests
        working-directory: wsl
        run: python -m unittest -v test_backends.py
